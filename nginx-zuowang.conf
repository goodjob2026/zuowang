# zuowang · 生产共享 nginx 的 server 块片段（不是完整主配置）
#
#   https://<CDN 域名> --HTTP:80--> 系统 nginx（按 server_name 分流）--> 本片段 --> 127.0.0.1:__APP_PORT__ 容器
#
# 这是模板：scripts/deploy.sh 把 __PUBLIC_HOST__ 换成 PUBLIC_ORIGIN 的域名，__APP_PORT__ 换成 deploy.conf 的 PROD_APP_PORT，
# 装到服务器 /etc/nginx/conf.d/zuowang.conf，nginx -t 通过后 systemctl reload nginx。
# 和同机其它游戏共用一个 nginx 进程、同一个 http 块：upstream、map 变量名都带项目前缀，不能撞名；
# gzip 之类的设置写在 server 里，不影响别的游戏。主配置见 skill 的 templates/server/nginx.conf。
# 前提：CDN 源端口 80、源请求策略 AllViewer（透传 Host，不然匹配不上 server_name）。

# gzip 会把服务端的强 ETag 改成 W/"…"，WebView 下次带 W/ 回来，服务端逐字比对不上，
# 304 就永远不生效、每次进游戏都重下整页。转发前把 W/ 去掉。
map $http_if_none_match $zuowang_if_none_match {
    "~^W/(?<tag>.+)$" $tag;
    default           $http_if_none_match;
}

upstream zuowang {
    server 127.0.0.1:__APP_PORT__;
    keepalive 32;
}

# CDN 终止 HTTPS、明文回源
server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_HOST__;

    access_log /var/log/nginx/zuowang.access.log main;
    error_log  /var/log/nginx/zuowang.error.log warn;

    # Node 一般不压缩，交给 nginx。gzip_proxied 默认 off，响应都来自 proxy_pass，不写就一个字节都不压。
    # gzip_vary 防止 CDN 把压缩过的响应发给不支持的客户端。text/html 默认就压。
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/javascript
        application/json;

    # 接口都是小 JSON；服务端自己限 64KB，这里对齐
    client_max_body_size 64k;
    # 跨域头由服务端自己带（含 OPTIONS 预检），这里不要再加 Access-Control-*，重复了浏览器会拒绝

    location / {
        proxy_pass http://zuowang;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header If-None-Match $zuowang_if_none_match;

        # 服务端（TRUST_PROXY=true）拿 X-Forwarded-Host 和浏览器的 Origin 比对，不对就 403。
        # 固定写 CDN 域名
        proxy_set_header X-Forwarded-Host $server_name;

        # 原样透传 CDN 的 XFF：CDN 把玩家 IP 追加在最后，服务端取最后一跳。
        # 不要用 $remote_addr 覆盖或 $proxy_add_x_forwarded_for 追加，那样所有玩家都算成
        # CDN 节点 IP，登录限流互相拖累。
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
