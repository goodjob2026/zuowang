# 部署参数：scripts/deploy.sh、scripts/prune-images.sh 读它（按 bash 执行）。
# 这里只放不敏感、跟着代码走的东西，进仓库；密钥、IM 平台地址放部署机上的 .env.<环境>，
# 服务器地址、私钥路径放部署机上的 deploy.local.conf（各游戏的 CLAUDE.md 要求仓库保持平台中立、不出现服务器信息）。
# 不要在这里写 .env 里的键（QINGLIAO_*、PUBLIC_ORIGIN、DEPLOY_*），会被当成环境变量、盖掉 .env 的值。

IMAGE=zuowang
# compose 项目名，也是服务器上部署目录的名字；要和 compose.yml 的 name 一致
PROJECT=zuowang
# 生产服上的部署目录是 $PROD_REMOTE_BASE/$PROJECT（数据盘）；测试服一律 ~/$PROJECT。不写这一行，生产也是 ~/$PROJECT（老项目的位置）；
# 老项目加上这一行后的第一次 prod 部署会自动把 ~/$PROJECT 迁过来（停容器 → 复制 → 老目录改名保留）
PROD_REMOTE_BASE=/data/minigame
# compose.yml 里的服务名，容器名是 $PROJECT-$SERVICE-1
SERVICE=zuowang
NGINX_CONF=nginx-zuowang.conf
SSH_USER=ec2-user
# IM 平台后台「平台配置」里的平台码，.env 没配 QINGLIAO_PF_CODE 时用它
PF_CODE=zuowang
# 1 = 服务端走轻聊登录：QINGLIAO_* 写进服务器 .env，QINGLIAO_SECRET 必填。
# 0 = 服务端不读 QINGLIAO_*（比如自己管登录的平台服务）：这些键不写、不检查，compose.yml 里也可以不列；
#     这时部署机上必须有 .env.<环境> 文件（或 -e 指定），不支持只靠环境变量部署
USE_QINGLIAO_KEYS=0
# 一个项目要占一整个域名（<平台码>.域名、api.域名、admin.域名）时填，例如 mg.example.com；一般游戏留空。
# 非空时 nginx 片段里的 __ROOT_DOMAIN__ 换成它、__ROOT_DOMAIN_RE__ 换成 mg\.example\.com（写正则 server_name 用），
# prod 检查服务器时 api.<它>、admin.<它> 也不能出现在别的项目的片段里。仓库要平台中立就写进 deploy.local.conf
ROOT_DOMAIN=

# 测试服：地址 + 端口，容器直连 0.0.0.0:$TEST_PORT，无 nginx
TEST_PORT=8187
# 测试服也要域名（CDN → 测试服系统 nginx :80 → 容器）时打开，一般游戏不用：
# 部署 test 时同样渲染、安装 $NGINX_CONF 片段（nginx -t 不过就恢复），容器端口仍是 0.0.0.0:$TEST_PORT，直连照常可用。
# 打开后 .env.test 的 PUBLIC_ORIGIN 要填 CDN 的 https 地址，TRUST_PROXY / COOKIE_SECURE 变成 true（直连 http 拿不到 Secure cookie）。
# 片段用了 __ROOT_DOMAIN__ 就要同时填 TEST_ROOT_DOMAIN（测试用的根域名，和 ROOT_DOMAIN 不能相同），写进 deploy.local.conf
# TEST_NGINX_MODE=shared
# TEST_ROOT_DOMAIN=

# 生产服：CDN → 共享系统 nginx :80（按 server_name = 游戏域名分流）→ 容器 127.0.0.1:$PROD_APP_PORT。
# $NGINX_CONF 是 server 块片段，部署时装进 /etc/nginx/conf.d/$PROJECT.conf；容器端口由脚本渲染进去，只在这里改。
# CDN 源端口 80、源请求策略 AllViewer（透传 Host）。
PROD_NGINX_MODE=shared
PROD_APP_PORT=8905
# 分支约定：main 开发，release 发布。生产只从这个分支发、并且要和 origin 上一致；留空 = 不查
PROD_BRANCH=release

# 服务器地址和私钥路径不进仓库：TEST_HOST / TEST_SSH_KEY / PROD_HOST / PROD_SSH_KEY 放在部署机本地的
# deploy.local.conf（已被 .gitignore 忽略），照 deploy.local.conf.example 填
_local=$(dirname "${BASH_SOURCE[0]}")/deploy.local.conf
[ -f "$_local" ] || { echo "缺少 ${_local}：cp deploy.local.conf.example deploy.local.conf 后填写" >&2; exit 1; }
. "$_local"
unset _local

# QINGLIAO_* 之外、要原样写进服务器 .env 给容器用的键，空格分隔；compose.yml 的 environment 里也要加
EXTRA_APP_KEYS="MG_PF_CODE MG_PUBLIC_KEYS CORS_ORIGIN"
# 调试登录密钥的键名（要同时写进 EXTRA_APP_KEYS）：只允许 test，prod 配了就拒绝部署。没有就留空
DEBUG_KEY=
# 必填的键（要在 EXTRA_APP_KEYS 里），为空就拒绝部署。管理后台密码这类生产必须有的密钥写这里
REQUIRED_KEYS="MG_PUBLIC_KEYS CORS_ORIGIN"

# 构建前在项目根目录跑的测试，留空就不跑。测试在子目录时写成 "(cd server && npm test --silent)"
# 厂商交付的仓库不带测试，留空
TEST_CMD=
# 健康检查和验收都请求它：GET 返回 2xx、不需要登录
HEALTH_PATH=/api/health
# 部署完服务器上每个镜像只留最近几个（有容器在用的不删），0 = 不清理
KEEP_IMAGES=3

# ---- 可选钩子：deploy.sh 里定义了就调用，可以用 remote / remote_bash / die / warn 和 $CONTAINER 等变量 ----
# 给服务器脚本传参数用 remote_bash <参数…> <<'EOF'（每个参数转义过，空值也能保住位置）；
# 不要写 remote bash -s -- <参数…>：ssh 会把空参数吞掉，后面的参数整体前移

# 传完镜像、启动新容器之前备份数据，两种写法选一个（都不选就是不备份）。启用时去掉那段每行开头的 "# "
# （heredoc 的 EOF 要顶格）。
#
# 写法一：数据是 /data 里的普通文件（JSON、图片……，服务端写文件用「写临时文件再改名」）。
# 用旧容器的镜像自带的 tar（alpine / debian 系镜像都有，distroless 没有）把整个数据卷打包到服务器
# /data/backups/$PROJECT/（数据盘；没有数据盘的测试服放 ~/$PROJECT/backups/），只留最近 10 份。不要求镜像里有 node。打包失败就停止部署，不会在没备份的情况下换版本。
# SQLite 不要用它：热拷贝可能拷到写了一半的库，用写法二。
