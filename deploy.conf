# 	remote_bash "$CONTAINER" "$PROJECT-data" "$PROJECT" <<'EOF'
# set -eo pipefail
# container=$1 volume=$2 dir=~/$3/backups
# # 有数据盘（生产服 /data，另一块 EBS）就放那里，测试服没有照旧放 home
# if [ -d /data/backups ]; then dir=/data/backups/$3; fi
# if [ -z "$(sudo docker ps -aq --filter "name=^${container}\$")" ]; then echo '没有旧容器（首次部署？），跳过'; exit 0; fi
# image=$(sudo docker inspect -f '{{.Config.Image}}' "$container")
# sudo docker image inspect "$image" >/dev/null 2>&1 || { echo "! 旧镜像 ${image} 不在了，跳过备份" >&2; exit 0; }
# mkdir -p "$dir" && chmod 700 "$dir"
# out="$dir/data-$(date +%Y%m%d-%H%M%S)-before-${image##*:}.tar.gz"
# if ! sudo docker run --rm --network none --read-only --entrypoint tar -v "$volume:/data:ro" "$image" -czf - -C /data . | (umask 077 && cat >"$out"); then
# 	rm -f "$out"; echo "备份数据卷 $volume 失败，停止部署" >&2; exit 1
# fi
# ls -1t "$dir"/data-*.tar.gz | tail -n +11 | xargs -r rm -f
# echo "已备份 ${out}（$(du -h "$out" | cut -f1)）"
# EOF
# }
#
# 写法二：数据是数据卷里的 SQLite（镜像里要有 node ≥ 22.13，不用加 --experimental-sqlite）。库路径改成服务端实际用的。
# 旧容器在跑就在里面做 VACUUM INTO；没在跑（一启动就崩、反复重启）就用它的镜像临时起一个容器做，
# 不然最需要回滚的时候脚本会卡在这一步。只留最近 10 份
hook_backup() {
	remote_bash "$CONTAINER" /data/zuowang.db "$PROJECT-data" <<'EOF'
set -e
container=$1 db=$2 volume=$3
if [ -z "$(sudo docker ps -aq --filter "name=^${container}\$")" ]; then echo '没有旧容器（首次部署？），跳过'; exit 0; fi
image=$(sudo docker inspect -f '{{.Config.Image}}' "$container")
old=${image##*:}
state=$(sudo docker inspect -f '{{.State.Status}}' "$container")
name="backup-$(date +%Y%m%d-%H%M%S)-before-${old}.db"
backup() { "$@" node --no-warnings -e '
process.umask(0o077);
const fs = require("node:fs");
const path = require("node:path");
const { DatabaseSync } = require("node:sqlite");
const [db, name] = process.argv.slice(1);
if (!fs.existsSync(db)) { console.log("还没有数据库，跳过"); process.exit(0); }
const dir = path.join(path.dirname(db), "backups");
fs.mkdirSync(dir, { recursive: true });
const out = path.join(dir, name);
const conn = new DatabaseSync(db, { readOnly: true });
conn.exec("VACUUM INTO '\''" + out + "'\''");
conn.close();
const all = fs.readdirSync(dir).filter((f) => f.endsWith(".db")).sort();
for (const f of all.slice(0, -10)) fs.unlinkSync(path.join(dir, f));
console.log("已备份 " + out);
' "$db" "$name"; }
# 有数据盘（生产服 /data，另一块 EBS）就把部署前备份从卷（系统盘）挪过去，只留最近 10 份；测试服没有就留在卷里
offload() { # <卷名> <项目> <文件名模式>
	[ -d /data/backups ] || return 0
	local src dst
	src=$(sudo docker volume inspect -f '{{.Mountpoint}}' "$1")/backups dst=/data/backups/$2
	mkdir -p "$dst" && chmod 700 "$dst"
	sudo find "$src" -maxdepth 1 -type f -name "$3" -exec mv -t "$dst" {} +
	{ sudo chown "$(id -u):$(id -g)" "$dst"/$3; ls -1t "$dst"/$3 | tail -n +11 | xargs -r rm -f; } 2>/dev/null || true
	echo "部署前备份已挪到 ${dst}（数据盘）"
}
if [ "$state" = running ] && backup sudo docker exec "$container"; then offload "$volume" "${volume%-data}" 'backup-*.db'; exit 0; fi
if sudo docker image inspect "$image" >/dev/null 2>&1; then
	echo "旧容器状态 ${state}，用镜像 ${image} 临时起一个容器备份"
	if backup sudo docker run --rm --read-only --network none -v "$volume:/data" "$image"; then offload "$volume" "${volume%-data}" 'backup-*.db'; else echo '! 备份失败，继续部署' >&2; fi
else
	echo "! 旧容器状态 ${state}，镜像 ${image} 也不在了，跳过备份" >&2
fi
EOF
}

